name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Dependency sanity check
        run: pip check

      - name: Lint
        run: ruff check .

      - name: Unit and benchmark tests
        run: pytest -q

      - name: Execute benchmark CLI
        run: anomaly-lab benchmark --samples 1600 --seed 7 --quantile 0.99 --output /tmp/anomaly-report.json

      - name: Validate benchmark artifact
        run: |
          python - <<'PY'
          import json
          data = json.load(open('/tmp/anomaly-report.json', encoding='utf-8'))
          assert len(data['records']) == 3
          assert all('event' in item['evaluation'] for item in data['records'])
          PY

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/dist

      - name: Verify wheel in isolated environment
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install /tmp/dist/*.whl
          /tmp/wheelcheck/bin/anomaly-lab benchmark --samples 1400 --seed 3 --output /tmp/wheel-report.json
