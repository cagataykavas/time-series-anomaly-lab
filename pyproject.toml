[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-anomaly-lab"
version = "0.2.0"
description = "Leakage-aware time-series anomaly detection, calibration and event evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
anomaly-lab = "anomaly_lab.cli:main"

[tool.setuptools.packages.find]
include = ["anomaly_lab*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
